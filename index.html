<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ИВБк-24 // Расписание</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #090a0c;
            --surface: #101216;
            --surface-hover: #16191f;
            --border: #1e2229;
            --border-strong: #2a303a;
            --text: #f1f3f5;
            --muted: #848d9a;
            --dim: #4d5562;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --green: #22c55e;
            --red: #ef4444;
            --purple: #a855f7;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13px;
            padding: 0 12px 60px;
            line-height: 1.4;
        }
        .container { max-width: 1100px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 11px;
        }
        .brand { font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .brand::before { content: ''; width: 6px; height: 6px; background: var(--accent); display: inline-block; }
        .hero { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
        .hero .tag { font-family: var(--font-mono); font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
        .hero h1 { font-size: clamp(18px, 2.2vw, 26px); font-weight: 700; color: #fff; }

        .controls {
            display: flex; flex-wrap: wrap; gap: 8px 12px;
            padding: 8px 20px; background: var(--surface);
            border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .controls .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
        .controls button {
            background: transparent; border: 1px solid var(--border);
            color: var(--muted); font-family: var(--font-mono); font-size: 10px;
            padding: 4px 10px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .controls button.active { border-color: var(--accent); color: #fff; background: var(--surface-hover); }
        .controls .export-btn {
            margin-left: auto;
            background: var(--accent); color: #fff; border: none;
            padding: 4px 14px;
        }

        .week-tabs {
            display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            align-items: center;
        }
        .week-tab {
            font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
            padding: 4px 12px; border: 1px solid var(--border); cursor: pointer;
            color: var(--muted); background: transparent;
        }
        .week-tab.active { border-color: var(--accent); color: #fff; background: var(--surface-hover); }

        .current-week-btn {
            font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
            padding: 4px 12px; border: 1px solid var(--accent); color: #fff;
            background: var(--accent-glow); cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .current-week-btn::before { content: '●'; color: var(--green); font-size: 9px; }

        .calendar-toggle-btn {
            font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
            padding: 4px 12px; border: 1px solid var(--border); color: var(--muted);
            background: transparent; cursor: pointer; margin-left: auto;
        }
        .calendar-toggle-btn.active { border-color: var(--accent); color: #fff; background: var(--surface-hover); }

        /* Компактный календарный блок */
        .calendar-panel {
            display: none; background: #0c0e12; border-bottom: 1px solid var(--border);
            padding: 10px 20px;
        }
        .calendar-panel.open { display: block; }
        .calendar-wrap {
            max-width: 380px; margin: 0 auto;
        }
        .calendar-header {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-bottom: 8px; font-family: var(--font-mono);
        }
        .calendar-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: #fff; letter-spacing: 0.05em; min-width: 140px; text-align: center;
        }
        .calendar-nav-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 2px 7px; font-family: var(--font-mono); font-size: 10px; cursor: pointer;
            transition: color 0.1s, border-color 0.1s;
        }
        .calendar-nav-btn:hover { color: #fff; border-color: var(--accent); }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
            font-family: var(--font-mono); font-size: 10px; text-align: center;
        }
        .cal-head { color: var(--dim); padding: 2px 0; font-size: 8px; text-transform: uppercase; }
        .cal-day {
            padding: 4px 2px; border: 1px solid var(--border); background: var(--surface);
            cursor: pointer; position: relative; transition: border-color 0.1s, background 0.1s;
            border-radius: 2px;
        }
        .cal-day:hover { background: var(--surface-hover); border-color: var(--border-strong); }
        .cal-day.empty { border-color: transparent; background: transparent; cursor: default; }
        .cal-day.today { border-color: var(--accent); background: var(--accent-glow); font-weight: 700; color: #fff; }
        .cal-day .cal-week-tag {
            display: block; font-size: 7px; color: var(--dim); line-height: 1; margin-top: 1px;
        }

        .week-content { display: none; }
        .week-content.active { display: block; }

        .schedule-grid {
            display: grid; grid-template-columns: 60px 1fr;
            border-bottom: 1px solid var(--border);
        }
        .schedule-grid .day-label {
            padding: 6px 10px; font-family: var(--font-mono); font-size: 10px;
            color: var(--muted); border-right: 1px solid var(--border);
            background: var(--surface);
        }
        .schedule-grid .day-cells { padding: 4px 10px; }
        .pair {
            padding: 3px 0; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: background 0.1s;
        }
        .pair:hover { background: var(--surface-hover); }
        .pair:last-child { border-bottom: none; }
        .pair .time { font-family: var(--font-mono); font-size: 10px; color: var(--dim); display: inline-block; width: 36px; }
        .pair .subject { color: #fff; }
        .pair .meta { font-size: 10px; color: var(--muted); margin-left: 6px; }

        .type-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            padding: 0 5px;
            border-radius: 3px;
            margin-right: 6px;
        }

        .empty-day { color: var(--dim); font-style: italic; padding: 5px 0; }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.75); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--surface); border: 1px solid var(--border-strong);
            max-width: 520px; width: 92%; max-height: 85vh; overflow-y: auto; padding: 20px;
            position: relative;
        }
        .modal-box .close {
            position: absolute; top: 10px; right: 14px;
            background: none; border: none; color: var(--muted);
            font-size: 20px; cursor: pointer;
        }
        .modal-box h3 { margin-bottom: 12px; color: #fff; font-size: 15px; }
        .modal-box dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13px; }
        .modal-box dt { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }

        .day-modal-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .day-modal-item {
            padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
            font-size: 12px;
        }
        .day-modal-item .pair-hdr {
            display: flex; justify-content: space-between; font-family: var(--font-mono);
            font-size: 10px; color: var(--muted); margin-bottom: 4px;
        }

        @media (max-width: 720px) {
            .schedule-grid { grid-template-columns: 1fr; }
            .schedule-grid .day-label { border-right: none; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .export-btn { margin-left: 0; }
            .calendar-toggle-btn { margin-left: 0; width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="brand">SCHEDULE // ИВБк-24</div>
        <div style="color:var(--muted);">2026–2027</div>
    </header>

    <section class="hero">
        <div class="tag">Расписание занятий</div>
        <h1>ИВБк-24</h1>
    </section>

    <div class="controls">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="Л">Лекции</button>
            <button class="filter-btn" data-filter="П">Практики</button>
            <button class="filter-btn" data-filter="ЛР">Лабораторные</button>
        </div>
        <button class="export-btn" id="exportCsv">⬇ CSV</button>
    </div>

    <div class="week-tabs">
        <button class="current-week-btn" id="btnCurrentWeek">Текущая: ...</button>
        <button class="week-tab active" data-week="odd">Нечётная</button>
        <button class="week-tab" data-week="even">Чётная</button>
        <button class="calendar-toggle-btn" id="btnToggleCalendar">📅 Календарь</button>
    </div>

    <!-- Компактный календарный блок с кнопками в центре -->
    <div class="calendar-panel" id="calendarPanel">
        <div class="calendar-wrap">
            <div class="calendar-header">
                <button class="calendar-nav-btn" id="calPrev">&lt;</button>
                <div class="calendar-title" id="calMonthTitle">Ноябрь 2026</div>
                <button class="calendar-nav-btn" id="calNext">&gt;</button>
            </div>
            <div class="calendar-grid" id="calGrid"></div>
        </div>
    </div>

    <div id="week-odd" class="week-content active"></div>
    <div id="week-even" class="week-content"></div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <button class="close" id="modalClose">&times;</button>
        <h3 id="modalTitle">Детали пары</h3>
        <div id="modalBody"></div>

</div>

    function getAcademicWeekInfo(targetDate = new Date()) {
        const d = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
        const diffDays = Math.floor((d - SEMESTER_START_MONDAY) / (1000 * 60 * 60 * 24));
        const weekNum = Math.floor(diffDays / 7) + 1;
        const isOdd = (weekNum % 2 !== 0);
        return {
            weekNum: weekNum,
            isOdd: isOdd,
            weekKey: isOdd ? 'odd' : 'even',
            inSemester: (weekNum >= 1 && weekNum <= 17)

                ],

    function isPairActiveOnWeek(pair, weekNum) {
        if (pair.validWeeks) return pair.validWeeks.includes(weekNum);
        if (pair.weeks) return (weekNum >= pair.weeks[0] && weekNum <= pair.weeks[1]);
        return true;
    }

    const dayOrder = ['ПН','ВТ','СР','ЧТ','ПТ','СБ'];
    const typeColors = { 'Л': '#22c55e', 'П': '#ef4444', 'ЛР': '#a855f7' };

    function renderWeek(weekKey, filterType = 'all') {
        const container = document.getElementById(`week-${weekKey}`);
        const weekData = data[weekKey];
        if (!weekData) { container.innerHTML = '<div class="empty-day">Нет данных</div>'; return; }

        let html = '';
        dayOrder.forEach(day => {
            const pairs = weekData.days[day] || [];
            const filtered = pairs.filter(p => filterType === 'all' || p.type === filterType);

            html += `<div class="schedule-grid">`;
            html += `<div class="day-label">${day}</div>`;
            html += `<div class="day-cells">`;
            if (filtered.length === 0) {
                html += `<div class="empty-day">— нет занятий —</div>`;
            } else {
                filtered.forEach(p => {
                    const color = typeColors[p.type] || '#888';
                    const meta = (p.teacher || p.room) ? `${p.teacher} · ${p.room}` : '';
                    const typeLabel = p.type;
                    html += `<div class="pair" data-detail='${JSON.stringify(p)}'>
                                <span class="time">${p.time}</span>
                                <span class="subject">
                                    <span class="type-badge" style="background:${color};color:#fff;">${typeLabel}</span>
                                    ${p.subject}
                                </span>
                                ${meta ? `<span class="meta">${meta}</span>` : ''}
                             </div>`;
                });
            }
            html += `</div></div>`;
        });

        container.innerHTML = html;
    }

    let currentFilter = 'all';
    let currentWeek = 'odd';

    function refresh() {
        renderWeek('odd', currentFilter);
        renderWeek('even', currentFilter);
        document.querySelectorAll('.week-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`week-${currentWeek}`).classList.add('active');
    }

    const curInfo = getAcademicWeekInfo();
    const btnCur = document.getElementById('btnCurrentWeek');
    if (curInfo.inSemester) {
        btnCur.textContent = `ТЕКУЩАЯ: ${curInfo.weekNum} НЕД. (${curInfo.isOdd ? 'НЕЧЁТ' : 'ЧЁТ'})`;
        currentWeek = curInfo.weekKey;
    } else {
        btnCur.textContent = `КАНИКУЛЫ / ВНЕ СЕМЕСТРА`;
    }

    btnCur.addEventListener('click', function() {
        if (curInfo.inSemester) {
            currentWeek = curInfo.weekKey;
            document.querySelectorAll('.week-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.week === currentWeek);
            });
            refresh();
        }
    });

    document.querySelectorAll('.week-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentWeek = this.dataset.week;
            refresh();
        });
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            refresh();
        });
    });

    document.addEventListener('click', function(e) {
        const pairEl = e.target.closest('.pair');
        if (pairEl && pairEl.dataset.detail) {
            try {
                const p = JSON.parse(pairEl.dataset.detail);
                document.getElementById('modalTitle').textContent = p.subject;
                const body = document.getElementById('modalBody');
                body.innerHTML = `
                    <dl>
                        <dt>Время</dt><dd>${p.time} пара</dd>
                        <dt>Тип</dt><dd>${p.type}</dd>
                        <dt>Преподаватель</dt><dd>${p.teacher || '—'}</dd>
                        <dt>Аудитория</dt><dd>${p.room || '—'}</dd>
                        <dt>Неделя</dt><dd>${currentWeek === 'odd' ? 'Нечётная' : 'Чётная'}</dd>
                    </dl>
                `;
                document.getElementById('modal').classList.add('open');
            } catch(e) {}
        }
    });

    document.getElementById('modalClose').addEventListener('click', function() {
        document.getElementById('modal').classList.remove('open');
    });
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
    });

    // ========== КАЛЕНДАРЬ ==========
    let calDate = new Date(2026, 10, 1); // Ноябрь 2026
    const monthsRu = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const calDayNames = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

    const btnToggleCal = document.getElementById('btnToggleCalendar');
    const calPanel = document.getElementById('calendarPanel');

    btnToggleCal.addEventListener('click', function() {
        calPanel.classList.toggle('open');
        this.classList.toggle('active');
        renderCalendar();
    });

    document.getElementById('calPrev').addEventListener('click', function() {
        calDate.setMonth(calDate.getMonth() - 1);
        renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', function() {
        calDate.setMonth(calDate.getMonth() + 1);
        renderCalendar();
    });

    function renderCalendar() {
        const year = calDate.getFullYear();
        const month = calDate.getMonth();
        document.getElementById('calMonthTitle').textContent = `${monthsRu[month]} ${year}`;

        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';

        calDayNames.forEach(name => {
            const el = document.createElement('div');
            el.className = 'cal-head';
            el.textContent = name;
            grid.appendChild(el);
        });

        const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDayIndex; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-day empty';
            grid.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const dayEl = document.createElement('div');
            dayEl.className = 'cal-day';
            const thisDate = new Date(year, month, d);
            const wInfo = getAcademicWeekInfo(thisDate);

            const isToday = (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d);
            if (isToday) dayEl.classList.add('today');

            let weekLabel = wInfo.inSemester ? `${wInfo.weekNum}н` : '';
            dayEl.innerHTML = `<strong>${d}</strong><span class="cal-week-tag">${weekLabel}</span>`;

            dayEl.addEventListener('click', function() {
                openDayScheduleModal(thisDate, wInfo);
            });

            grid.appendChild(dayEl);
        }
    }

    function openDayScheduleModal(dateObj, wInfo) {
        const dayIdx = (dateObj.getDay() + 6) % 7;
        const dayKey = dayOrder[dayIdx];
        const dayFullNames = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
        const dateFormatted = `${dateObj.getDate()} ${monthsRu[dateObj.getMonth()].toLowerCase()} ${dateObj.getFullYear()}`;

        document.getElementById('modalTitle').textContent = `${dayFullNames[dayIdx]}, ${dateFormatted}`;

        const body = document.getElementById('modalBody');
        let html = '';

        if (!wInfo.inSemester) {
            html = `<div class="empty-day">Дата находится вне рамок осеннего семестра (каникулы/сессия).</div>`;
        } else if (dayIdx === 6) {
            html = `
                <dl style="margin-bottom:12px;">
                    <dt>Неделя</dt><dd>${wInfo.weekNum} (${wInfo.isOdd ? 'нечётная' : 'чётная'})</dd>
                </dl>
                <div class="empty-day">Воскресенье — выходной день</div>
            `;
        } else {
            const weekKey = wInfo.weekKey;
            const pairs = (data[weekKey].days[dayKey] || []);
            const activePairs = pairs.filter(p => isPairActiveOnWeek(p, wInfo.weekNum));

            html += `
                <dl style="margin-bottom:12px;">
                    <dt>Семестр</dt><dd>${wInfo.weekNum}-я неделя (${wInfo.isOdd ? 'нечётная' : 'чётная'})</dd>
                    <dt>Всего пар</dt><dd>${activePairs.length}</dd>
                </dl>
            `;

            if (activePairs.length === 0) {
                html += `<div class="empty-day">— занятий нет —</div>`;
            } else {
                html += `<div class="day-modal-list">`;
                activePairs.forEach(p => {
                    const color = typeColors[p.type] || '#888';
                    html += `
                        <div class="day-modal-item">
                            <div class="pair-hdr">
                                <span>${p.time} ПАРА</span>
                                <span style="color:${color}; font-weight:600;">[${p.type}]</span>
                            </div>
                            <div style="font-weight:600; color:#fff; margin-bottom:2px;">${p.subject}</div>
                            <div style="color:var(--muted); font-size:11px;">${p.teacher ? p.teacher + ' · ' : ''}${p.room || ''}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
        }

        body.innerHTML = html;
        document.getElementById('modal').classList.add('open');
    }

    document.getElementById('exportCsv').addEventListener('click', function() {
        let csv = 'Неделя,День,Время,Предмет,Тип,Преподаватель,Аудитория\n';
        ['odd','even'].forEach(w => {
            const weekLabel = w === 'odd' ? 'Нечётная' : 'Чётная';
            const days = data[w].days;
            dayOrder.forEach(d => {
                (days[d] || []).forEach(p => {
                    csv += `${weekLabel},${d},${p.time},${p.subject},${p.type},${p.teacher || ''},${p.room || ''}\n`;
                });
            });
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'raspisanie_IVBk-24.csv';
        link.click();
    });

    refresh();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
                .then(function(reg) {
                    console.log('Service Worker зарегистрирован', reg);
                })
                .catch(function(err) {
                    console.log('Ошибка регистрации Service Worker', err);
                });
        });
    }
</script>
</body>
</html>
